aid: abmtx
name: ABM Therapeutics
description: 'ABM Therapeutics (ABM) is a clinical-stage biopharmaceutical company founded
  in 2015, operating from San Diego, California and Zhangjiang, Pudong, Shanghai. It
  discovers and develops small-molecule targeted therapies for primary brain cancers
  including glioblastoma multiforme (GBM) and for brain metastases arising from melanoma,
  lung cancer and breast cancer. Its lead program, ABM-1310, is a brain-penetrant,
  selective BRAF V600 inhibitor that received US IND clearance in November 2019 and
  is in Phase 1 clinical study. ABM publishes no developer program, public API, SDK
  or machine-readable specification; its only public surface is a corporate, investor
  and clinical-news website. The company was surfaced through the API Evangelist harvest
  backlog from a secondary-market listing under the ticker-style slug "abmtx".'
